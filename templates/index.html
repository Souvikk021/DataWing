<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Handwriting Static Feature Extractor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="mb-4">🖋️ Handwriting Static Feature Extractor</h1>
      <p>Upload a handwriting image (PNG, JPG, TIFF). The server will extract static features and show results.</p>

      <form method="post" action="/upload" enctype="multipart/form-data" class="mb-3">
        <div class="mb-3">
          <input class="form-control" type="file" id="file" name="file" accept="image/*" required>
        </div>
        <button class="btn btn-primary" type="submit">Upload & Process</button>
      </form>

      <hr>
      <p class="text-muted">Tip: use scanned handwriting or a high-quality phone photo for best results.</p>
    </div>
  </body>
</html>
